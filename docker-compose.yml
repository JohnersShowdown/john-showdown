services:
  pokemon-showdown:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
    volumes:
      # Persist compiled JS so subsequent restarts skip 'node build'
      - ps-dist:/app/dist
      # Persist logs and databases across container restarts
      - ps-logs:/app/logs
      - ps-databases:/app/databases
      # To use a custom config, uncomment the line below and provide the file:
      # - ./config/config.js:/app/config/config.js:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${PORT:-8000}"]
      interval: 30s
      timeout: 10s
      # Allow up to 7 minutes on first start for compilation
      start_period: 420s
      retries: 10

volumes:
  ps-dist:
  ps-logs:
  ps-databases:
